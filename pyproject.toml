[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pithos-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
pithos-contracts = "pithos_contracts.cli:main"
pithos-model-probe = "pithos_model_probe.cli:main"
pithos-capability-probe = "pithos_capability_probe.cli:main"
pithos-continuity = "pithos_continuity.cli:main"
pithos-runner = "pithos_runner.cli:main"
pithos-git-broker = "pithos_git_broker.cli:main"
pithos-harness = "pithos_harness.cli:main"
pithos-events = "pithos_event_store.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/pithos_contracts",
  "src/pithos_model_probe",
  "src/pithos_capability_probe",
  "src/pithos_continuity",
  "src/pithos_runner",
  "src/pithos_git_broker",
  "src/pithos_harness",
  "src/pithos_event_store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
