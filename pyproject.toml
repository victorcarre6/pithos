[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pithos-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
pithos-contracts = "pithos_contracts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pithos_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

