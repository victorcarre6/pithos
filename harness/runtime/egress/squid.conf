http_port 3128

auth_param basic program /usr/lib/squid/basic_fake_auth
auth_param basic realm Pithos

acl allowed_domains dstdomain \
    host.docker.internal \
    .github.com \
    .githubusercontent.com \
    .npmjs.org \
    .pypi.org \
    .pythonhosted.org \
    pi.dev \
    .huggingface.co
acl SSL_ports port 443
acl Safe_ports port 80 443 11434
acl CONNECT method CONNECT
acl identified proxy_auth REQUIRED

http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports
http_access deny !identified
http_access allow allowed_domains
http_access deny all

logformat pithos %ts.%03tu %un %>a %rm %ru %>Hs %<st
access_log stdio:/var/log/squid/access.log pithos
cache deny all
