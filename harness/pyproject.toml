[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pithos-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema[format]>=4.23,<5",
  "psutil>=6.1,<8",
  "PyYAML>=6.0,<7",
  "textual>=1,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
]

[project.scripts]
pithos-contracts = "pithos_contracts.cli:main"
pithos-model-probe = "pithos_model_probe.cli:main"
pithos-benchmark = "pithos_benchmark.cli:main"
pithos-capability-probe = "pithos_capability_probe.cli:main"
pithos-continuity = "pithos_continuity.cli:main"
pithos-runner = "pithos_runner.cli:main"
pithos-git-broker = "pithos_git_broker.cli:main"
pithos-harness = "pithos_harness.cli:main"
pithos-events = "pithos_event_store.cli:main"
pithos-telegram = "pithos_telegram.cli:main"
pithos-live-log = "pithos_live_log.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/pithos_contracts",
  "src/pithos_model_probe",
  "src/pithos_benchmark",
  "src/pithos_capability_probe",
  "src/pithos_continuity",
  "src/pithos_runner",
  "src/pithos_git_broker",
  "src/pithos_harness",
  "src/pithos_event_store",
  "src/pithos_telegram",
  "src/pithos_live_log",
  "src/pithos_orchestrator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
