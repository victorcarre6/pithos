<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
    <title>Pithos Visualizer</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #03040c; color: #e8fbff; }
      canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      .controls {
        position: fixed; z-index: 1; top: 18px; left: 18px; display: flex; gap: 8px; align-items: center;
        padding: 10px; border: 1px solid #2c4155; background: rgba(3, 4, 12, 0.78); backdrop-filter: blur(12px);
      }
      button, select { border: 1px solid #00f6ff; background: #07131c; color: inherit; padding: 8px 10px; }
      button:hover, select:hover { background: #10293a; }
      #status { min-width: 5rem; color: #9ab7c7; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas aria-label="Audio-reactive three-band visualization"></canvas>
    <div class="controls">
      <button id="start" type="button">start audio</button>
      <select id="device" aria-label="Audio input"><option value="">default input</option></select>
      <select id="theme" aria-label="Visual theme">
        <option value="neon">neon</option>
        <option value="acid">acid</option>
        <option value="ember">ember</option>
      </select>
      <button id="fullscreen" type="button">fullscreen</button>
      <span id="status">idle</span>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
